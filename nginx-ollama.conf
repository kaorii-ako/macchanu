# Paste this INSIDE your existing server { } block in nginx.conf
# It proxies /ollama/ → Ollama running locally on port 11434
# Required for the /ai chat page to reach the model.

location /ollama/ {
    proxy_pass         http://127.0.0.1:11434/;
    proxy_set_header   Host localhost;
    proxy_set_header   X-Real-IP $remote_addr;

    # Required for streaming (SSE / chunked responses)
    proxy_buffering            off;
    proxy_cache                off;
    proxy_read_timeout         600s;
    proxy_connect_timeout      10s;
    chunked_transfer_encoding  on;
    proxy_http_version         1.1;
}
